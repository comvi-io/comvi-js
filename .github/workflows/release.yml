name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'comvi-io/comvi-js'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm 11.5.1+ for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: release packages"
          title: "chore: release packages"
          version: pnpm changeset version
          publish: npm exec --no -- changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The combined GitHub Release runs AFTER `changeset publish` by necessity:
      # it consumes `steps.changesets.outputs.publishedPackages`, which only exists
      # once publish has happened. So if this step fails, npm is already live while
      # the GitHub Release is missing. That is acceptable and recoverable: the script
      # is keyed by the version tag and can be re-run manually
      # (`PUBLISHED_PACKAGES=… node .github/scripts/create-combined-release.mjs`, or
      # re-run this job) to create the missing Release without re-publishing npm.
      - name: Create combined GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node .github/scripts/create-combined-release.mjs
