name: Release

on:
  workflow_dispatch:
    inputs:
      rc:
        description: >-
          RC rehearsal (release plan §7.1): publish every releasable package as
          <next>-rc.<N> under the npm dist-tag `next` from the CURRENT ref, without
          consuming changesets or touching main. Leave empty for the normal path.
        required: false
        default: ""
        type: string
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # RC rehearsal. Versions and peer ranges are rewritten in this job's working
  # tree only (scripts/rc-version.mjs); nothing is committed, no changeset is
  # consumed, and no GitHub release is created. Publishes with `pnpm publish`
  # (OIDC trusted publishing, same workflow file as GA so the npm
  # trusted-publisher binding holds);
  # `--access public` is required because `access: public` lives only in the
  # Changesets config.
  rc:
    if: github.repository == 'comvi-io/comvi-js' && github.event_name == 'workflow_dispatch' && inputs.rc != ''
    runs-on: ubuntu-latest
    # Two full examples:e2e runs (seven frameworks, both modes) gate the publish.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm 11.5.1+ for OIDC trusted publishing
        run: npm install -g npm@11.11.0

      # The rewrite runs BEFORE the build: @comvi/core inlines its own version
      # into dist (vite `define: __VERSION__`), and nothing between the rewrite
      # and `pnpm publish` rebuilds — no package has a prepack/prepublishOnly
      # script. Building first published an rc tarball whose runtime reported
      # the previous GA version, which also blinded the version-keyed
      # duplicate-copy guard.
      #
      # The input reaches the shell through the environment, never through
      # `${{ }}` inside the `run:` body: interpolation happens before the shell
      # parses the line, so a `$(…)` in the input would execute even inside
      # double quotes. rc-version.mjs's own `/^\d+$/` check runs far too late to
      # help with that. The step NAME may interpolate — it is not executed.
      - name: Rewrite versions to rc.${{ inputs.rc }} (working tree only)
        env:
          RC: ${{ inputs.rc }}
        run: node scripts/rc-version.mjs --rc "$RC"

      - name: Build
        run: pnpm build

      - name: Verify built artifacts inline the manifest version
        run: node tooling/check-inlined-version.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Packs once, prints each tarball's sha256, runs `examples:e2e` in both
      # modes against THOSE files (`--tarballs`), and only then publishes the
      # same files with `npm publish <tgz>` — nothing is rebuilt or re-packed
      # between verification and publish.
      - name: Verify and publish the rc tarballs under dist-tag next
        run: node scripts/publish-candidate.mjs --dir release-candidate --tag next

      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-rc-examples-e2e
          path: |
            test-results/examples-e2e/
            release-candidate/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.repository == 'comvi-io/comvi-js' && (github.event_name != 'workflow_dispatch' || inputs.rc == '')
    runs-on: ubuntu-latest
    # A publishing run verifies the candidate with two full examples:e2e runs.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.1

      # setup-node stays on v5: v6 limits automatic caching to npm,
      # and this workflow relies on `cache: pnpm`
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm 11.5.1+ for OIDC trusted publishing
        # npm 12 rejects pnpm's --no-git-checks publish flag. Keep the OIDC-capable
        # npm 11 line pinned until the pnpm/Changesets publish path supports npm 12.
        run: npm install -g npm@11.11.0

      - name: Build
        run: pnpm build

      # Cheap insurance on the publishing run: the checkout is already
      # versioned there, so dist must inline the version npm is about to
      # receive. On the versioning run it simply confirms the pre-bump build.
      - name: Verify built artifacts inline the manifest version
        run: node tooling/check-inlined-version.mjs

      # Needed only when the run publishes, and cheap enough to install always:
      # the publish command below decides, not this workflow.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `publish` packs the versioned checkout once, exits early when every
      # version is already on npm, runs `examples:e2e` in both modes against the
      # packed files, and publishes exactly those files (`npm publish <tgz>`),
      # printing their sha256 and the `New tag:` lines this action reads for
      # `publishedPackages`. `--git-tag` creates the tags `changeset publish`
      # would; the action pushes them.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: release packages"
          title: "chore: release packages"
          version: pnpm release:version
          publish: node scripts/publish-candidate.mjs --dir release-candidate --tag latest --git-tag
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-ga-examples-e2e
          path: |
            test-results/examples-e2e/
            release-candidate/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 14

      # Runs after publish (needs publishedPackages output). If it fails, npm is live but GH Release is missing —
      # re-run this step or run `PUBLISHED_PACKAGES=… node .github/scripts/create-combined-release.mjs` manually.
      - name: Create combined GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node .github/scripts/create-combined-release.mjs
