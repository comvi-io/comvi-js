name: Release

on:
  workflow_dispatch:
    inputs:
      rc:
        description: >-
          RC rehearsal (release plan §7.1): publish every releasable package as
          <next>-rc.<N> under the npm dist-tag `next` from the CURRENT ref, without
          consuming changesets or touching main. Leave empty for the normal path,
          which is refused on any ref other than main.
        required: false
        default: ""
        type: string
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default: every job names the least it needs.
permissions: {}

# Each release path is three jobs (GA: plus `ga-guard`, which refuses any ref
# but main, and `version` for the release PR).
#
#   *pack     (contents: read; installs cold, without the Actions pnpm cache
#             that verify and CI fill from untrusted installs) builds, packs
#             ONCE into release-candidate/, writes SHA256SUMS — the only list
#             of what may be published —
#             and uploads it as the `release-candidate` artifact. Its outputs
#             `sums` (sha256 of SHA256SUMS) and `pending` are the only job
#             outputs the publishing job reads. No e2e, no browser.
#   *verify   (contents: read, no id-token, credentials not persisted)
#             downloads that artifact and runs examples:e2e in both modes
#             against those files (`--tarballs`; no build, no pack). It
#             installs every example with unpinned third-party packages. pnpm
#             10 blocks their build scripts (the temp copies allow none), but
#             that code still runs in each example's build, server and browser,
#             so the job is treated as hostile: it writes no outputs, uploads
#             only diagnostics, and its one effect on publishing is its exit
#             status.
#   *publish  (id-token: write; GA also contents: write for tags) installs
#             and builds nothing. It downloads PACK's artifact, checks that
#             SHA256SUMS hashes to pack's `sums`, that every listed tarball
#             matches it and that the directory holds nothing else, reads each
#             tarball's name and version from its own package.json, and runs
#             `npm publish <tgz>` on exactly those bytes, under a staging
#             dist-tag of that candidate (`release-<sums prefix>`). The
#             SHA256SUMS set is one transaction: only once npm has EVERY
#             candidate does `latest` (GA) or `next` (RC) move, package by
#             package; GA then reports `published=true` (and creates the
#             GitHub Release) only if every package is on `latest` and every
#             package tag plus `v<version>` names the checked-out commit.
#             Anything less exits 1 with a status table, and "Re-run failed
#             jobs" on `publish` completes it.
#
# All publish jobs live in this workflow file, so the npm trusted-publisher
# binding (which names the workflow file) holds for GA and RC alike.

jobs:
  # RC rehearsal. Versions and peer ranges are rewritten in rc-pack's working
  # tree only (scripts/rc-version.mjs); nothing is committed, no changeset is
  # consumed, and no GitHub release is created. `--access public` is passed
  # by the publish script because `access: public` lives only in the
  # Changesets config.
  rc-pack:
    if: github.repository == 'comvi-io/comvi-js' && github.event_name == 'workflow_dispatch' && inputs.rc != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pack.outputs.pending }}
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No `cache: pnpm`: verify and CI install untrusted examples into the pnpm store
          # and save it to the Actions cache; the job that builds the release installs cold.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The rewrite runs BEFORE the build: @comvi/core inlines its own version
      # into dist (vite `define: __VERSION__`), and nothing between the rewrite
      # and the pack rebuilds — no package has a prepack/prepublishOnly script.
      # Building first published an rc tarball whose runtime reported the
      # previous GA version, which also blinded the version-keyed duplicate-copy
      # guard.
      #
      # The input reaches the shell through the environment, never through
      # `${{ }}` inside the `run:` body: interpolation happens before the shell
      # parses the line, so a `$(…)` in the input would execute even inside
      # double quotes. rc-version.mjs's own `/^\d+$/` check runs far too late to
      # help with that. The step NAME may interpolate — it is not executed.
      - name: Rewrite versions to rc.${{ inputs.rc }} (working tree only)
        env:
          RC: ${{ inputs.rc }}
        run: node scripts/rc-version.mjs --rc "$RC"

      - name: Build
        run: pnpm build

      - name: Verify built artifacts inline the manifest version
        run: node tooling/check-inlined-version.mjs

      - name: Pack the candidate
        id: pack
        run: node scripts/publish-candidate.mjs pack --dir release-candidate

      - name: Upload the candidate
        if: steps.pack.outputs.pending == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  rc-verify:
    needs: rc-pack
    if: needs.rc-pack.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    # Two full examples:e2e runs (seven gallery examples in both modes, the two SSR recipes in the default one).
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download the candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release-candidate

      - name: Run examples:e2e against the candidate
        run: node scripts/publish-candidate.mjs verify --dir release-candidate

      # The run's verdicts as data, kept on success too: which candidate (the
      # sha256 of its SHA256SUMS), which tarballs, every step of every example.
      - name: Upload the e2e report (bundled catalogs)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-rc-e2e-report-default-${{ needs.rc-pack.outputs.sums }}
          path: test-results/examples-e2e/report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the e2e report (--cdn)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-rc-e2e-report-cdn-${{ needs.rc-pack.outputs.sums }}
          path: test-results/examples-e2e/report-cdn.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-rc-examples-e2e
          path: test-results/examples-e2e/
          if-no-files-found: ignore
          retention-days: 14

  rc-publish:
    needs: [rc-pack, rc-verify]
    if: needs.rc-pack.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    # The publish step waits up to 10 min for npm to show each accepted
    # version (see the GA publish job); setup and 12 publishes take ~5 min.
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # setup-node v5 turns on dependency caching from `packageManager` by
          # default and then looks for pnpm; this job installs nothing with
          # pnpm and sets it up on purpose, so the cache stays off.
          package-manager-cache: false

      # setup-node cannot pin npm itself; this is npm's own package at an exact
      # version, the one install this job makes. 11.21.0 is the first npm 11
      # whose OIDC token also covers `npm dist-tag` (the promotion step); each
      # package's trusted publisher must have "Allow npm dist-tag" enabled.
      - name: Ensure npm 11.21.0+ for OIDC trusted publishing and dist-tags
        run: npm install -g npm@11.21.0

      - name: Download the candidate (from rc-pack)
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release-candidate

      - name: Publish the verified rc tarballs under dist-tag next
        env:
          SUMS: ${{ needs.rc-pack.outputs.sums }}
        run: node scripts/publish-candidate.mjs publish --dir release-candidate --expect-sums "$SUMS" --tag next

  # GA runs from main only. A dispatch without `rc` is the GA path whatever
  # ref it names, and that path ends in `npm publish` under `latest`, git tags
  # and a GitHub Release, none of which can be undone. Every GA job waits for
  # this one, so a refused ref skips them all and the run is red with one
  # message. The RC jobs do not wait for it: the rehearsal runs from any ref.
  # scripts/release-workflow.test.mjs executes this step's shell.
  ga-guard:
    if: github.repository == 'comvi-io/comvi-js' && (github.event_name != 'workflow_dispatch' || inputs.rc == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse the GA path outside main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=GA release refused::This run is on $GITHUB_REF. The GA path (npm dist-tag latest, git tags, GitHub Release) runs only on refs/heads/main. For a rehearsal from this ref, dispatch again with the rc input set."
            exit 1
          fi
          echo "On refs/heads/main: the GA path may run."

  # GA: the release PR. With pending changesets, changesets/action opens or
  # updates it through `pnpm release:version`; with none it does nothing (it
  # is given no publish command — publishing is pack → verify → publish).
  version:
    needs: ga-guard
    if: github.repository == 'comvi-io/comvi-js' && (github.event_name != 'workflow_dispatch' || inputs.rc == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      # setup-node stays on v5: v6 limits automatic caching to npm,
      # and this workflow relies on `cache: pnpm`
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # v2 is the line for @changesets/cli 3 (v1 is for cli 2). It takes the
      # token as an input, not from GITHUB_TOKEN in env, and pushes the release
      # commit through the GitHub API. Tags and releases are not its job here:
      # it gets no publish script.
      - name: Create or update the release PR
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          version-script: pnpm release:version
          create-github-releases: false
          push-git-tags: false

  # GA: a push with no pending changesets is the merged release PR (or a push
  # after a release, which finds nothing new on npm and stops here).
  pack:
    needs: ga-guard
    if: github.repository == 'comvi-io/comvi-js' && (github.event_name != 'workflow_dispatch' || inputs.rc == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pack.outputs.pending }}
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same rule changesets/action uses to choose between the release PR
      # and publishing: any changeset left means this is not a release commit.
      - name: Pending changesets?
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "Changesets are pending: the version job handles this push."
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # The hand-written notes of this version become the GitHub Release body
      # as they are, and a re-run never rewrites a body. An HTML comment left
      # in them (a draft marker, a slot for a bullet) fails the release here,
      # before anything is built or published; the message names the file and
      # the line. The release PR is opened with GITHUB_TOKEN and may get no CI
      # run, so this is the check that always runs.
      - name: Refuse release notes that still hold an HTML comment
        if: steps.changesets.outputs.pending == 'false'
        run: node .github/scripts/check-release-notes.mjs

      - name: Setup pnpm
        if: steps.changesets.outputs.pending == 'false'
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.changesets.outputs.pending == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # No `cache: pnpm`: verify and CI install untrusted examples into the pnpm store
          # and save it to the Actions cache; the job that builds the release installs cold.

      - name: Install dependencies
        if: steps.changesets.outputs.pending == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.changesets.outputs.pending == 'false'
        run: pnpm build

      # The checkout is already versioned here, so dist must inline the
      # version npm is about to receive.
      - name: Verify built artifacts inline the manifest version
        if: steps.changesets.outputs.pending == 'false'
        run: node tooling/check-inlined-version.mjs

      # Writes pending=false when every version is already on npm.
      - name: Pack the candidate
        id: pack
        if: steps.changesets.outputs.pending == 'false'
        run: node scripts/publish-candidate.mjs pack --dir release-candidate

      - name: Upload the candidate
        if: steps.pack.outputs.pending == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: pack
    if: needs.pack.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    # Two full examples:e2e runs (seven gallery examples in both modes, the two SSR recipes in the default one).
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download the candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release-candidate

      - name: Run examples:e2e against the candidate
        run: node scripts/publish-candidate.mjs verify --dir release-candidate

      # The run's verdicts as data, kept on success too: which candidate (the
      # sha256 of its SHA256SUMS), which tarballs, every step of every example.
      - name: Upload the e2e report (bundled catalogs)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-ga-e2e-report-default-${{ needs.pack.outputs.sums }}
          path: test-results/examples-e2e/report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the e2e report (--cdn)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-ga-e2e-report-cdn-${{ needs.pack.outputs.sums }}
          path: test-results/examples-e2e/report-cdn.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-ga-examples-e2e
          path: test-results/examples-e2e/
          if-no-files-found: ignore
          retention-days: 14

  # GA: publish the verified bytes, tag them, release them. `ga-guard` already
  # refused any other ref; the job that holds the npm token names main itself
  # as well, so it does not depend on the `needs` chain alone.
  publish:
    needs: [pack, verify]
    if: needs.pack.outputs.pending == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Setup and 12 publishes take ~5 min, the wait for npm to show each
    # accepted version up to 10 min after its publish, the jsDelivr purge up
    # to 5 min: 30 leaves room for promotion and tags.
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      # Credentials ARE persisted here: the publish script pushes the tags of
      # what it published. Nothing in this job installs or builds anything
      # beyond npm itself.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # setup-node v5 turns on dependency caching from `packageManager` by
          # default and then looks for pnpm; this job installs nothing with
          # pnpm and sets it up on purpose, so the cache stays off.
          package-manager-cache: false

      # setup-node cannot pin npm itself; this is npm's own package at an exact
      # version, the one install this job makes. 11.21.0 is the first npm 11
      # whose OIDC token also covers `npm dist-tag` (the promotion step); each
      # package's trusted publisher must have "Allow npm dist-tag" enabled.
      - name: Ensure npm 11.21.0+ for OIDC trusted publishing and dist-tags
        run: npm install -g npm@11.21.0

      - name: Download the candidate (from pack)
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release-candidate

      # Publishes every tarball SHA256SUMS lists that npm does not have yet
      # (core first) under the candidate's staging dist-tag, continuing past a
      # failed one; then asks npm about EVERY candidate and logs the table.
      # Only a complete set moves `latest` (dist-tag add, per package, where
      # it is not there yet), so users never resolve half a train, and a
      # dist-tag is never moved backwards. Tags each version npm has at this
      # checkout's commit (also ones an earlier run published but never
      # tagged) and, once the whole set is on npm, `v<version>` too. A tag
      # already at another commit is refused, and for versions already on
      # npm that is checked BEFORE publishing, so a newer commit never
      # completes an older train. `published=true` with the whole set only
      # when complete; otherwise `published=false` and exit 1. A version npm
      # accepted is waited for up to 10 min before it counts as MISSING: npm
      # showed 0.6.0's react about 4 min after accepting it.
      # "Re-run failed jobs" skips what npm has and finishes the rest.
      - name: Publish the verified tarballs
        id: publish
        env:
          SUMS: ${{ needs.pack.outputs.sums }}
        run: node scripts/publish-candidate.mjs publish --dir release-candidate --expect-sums "$SUMS" --tag latest --git-tag --push-tags

      # The devtools() editor loader requests this one file under `@latest`
      # (packages/core/src/core/devtools.ts), and jsDelivr's edge keeps a version
      # alias for 12 hours (`s-maxage=43200`), so without a purge a fixed
      # editor reaches sites up to half a day after npm has it. The endpoint
      # is public and takes no token. Never fatal: npm is already live when
      # this runs, so a refused, throttled or unreachable purge is a warning
      # and the edge expires on its own. Two attempts, 30 s each.
      #
      # The purge is asynchronous. jsDelivr's own purge page
      # (jsdelivr/www.jsdelivr.com, src/views/pages/tools/purge.html) gets an
      # `id` back and polls purge.jsdelivr.net/status/<id> until `status` is
      # "finished", so a "pending" first answer is polled here too: five
      # times, 5 s apart. The `id` goes into a URL only when it is 1 to 64
      # letters, digits, `_` and `-`. The answer is parsed with jq (on the
      # runner image), never matched as text. Only a finished answer counts as
      # accepted: `status` is "finished", there is a path, and every path has
      # `throttled` false and at least one provider, each `true`. A challenge
      # page, an empty body, a value of another type, a failed status, or one
      # still pending after the last poll is a warning, so the log never says
      # "accepted" by default. Worst case 245 s: 30 + 10 + 30 for the two
      # attempts, then 5 × (5 + 30) for the polls.
      # scripts/release-workflow.test.mjs executes this step's shell.
      - name: Purge jsDelivr's @latest editor file
        if: steps.publish.outputs.published == 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          url="https://purge.jsdelivr.net/npm/@comvi/plugin-in-context-editor@latest/dist/standalone.iife.js"
          stale="The release is published; jsDelivr's edge may serve the previous @latest editor for up to 12 hours. Purge by hand: https://www.jsdelivr.com/tools/purge"
          # Prints the first 2000 characters behind a prefix: a line that
          # begins with `::` is a workflow command.
          show() { printf '%s\n' "${1:0:2000}" | sed 's/^/jsDelivr: /'; }
          # The answer, read as JSON: accepted | throttled | pending |
          # unconfirmed. Anything jq cannot parse, or more than one JSON
          # value, falls through to the warning. Accepted limit: jq keeps the
          # LAST of duplicate keys, so `"CF":false,"CF":true` reads as true;
          # that is malformed JSON a server does not send, and it is not
          # coded around.
          verdict() {
            printf '%s' "$1" | jq -r '
              if type != "object" then "unconfirmed"
              elif [.paths | objects | .[] | objects | .throttled == true] | any then "throttled"
              elif .status == "pending" then "pending"
              elif .status == "finished"
                and (.paths | type) == "object" and (.paths | length) > 0
                and ([.paths[]
                  | type == "object" and .throttled == false
                    and (.providers | type) == "object" and (.providers | length) > 0
                    and ([.providers[] == true] | all)] | all)
              then "accepted"
              else "unconfirmed" end' 2>/dev/null || echo unconfirmed
          }
          for attempt in 1 2; do
            if body="$(curl --fail --silent --show-error --max-time 30 "$url")"; then
              show "$body"
              answer="$(verdict "$body")"
              polls=0
              # Read once, from the answer to the purge request: a status
              # answer need not repeat the id, and cannot redirect the poll.
              # `$(…)` drops a trailing newline before the check, harmlessly.
              id="$(printf '%s' "$body" | jq -r '.id | strings' 2>/dev/null || true)"
              while [ "$polls" -lt 5 ] && [ "$answer" = pending ] &&
                [[ "$id" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; do
                polls=$((polls + 1))
                sleep 5
                if body="$(curl --fail --silent --show-error --max-time 30 "https://purge.jsdelivr.net/status/$id")"; then
                  show "$body"
                  answer="$(verdict "$body")"
                else
                  answer=unconfirmed
                fi
              done
              case "$answer" in
                accepted)
                  echo "jsDelivr accepted the purge of $url (attempt $attempt, $polls status request(s))."
                  ;;
                throttled)
                  echo "::warning title=jsDelivr purge throttled::jsDelivr rate-limited the purge of $url. $stale"
                  ;;
                *)
                  echo "::warning title=jsDelivr purge not confirmed::The answer to $url is not a finished purge on every provider. $stale"
                  ;;
              esac
              exit 0
            fi
            if [ "$attempt" = 1 ]; then sleep 10; fi
          done
          echo "::warning title=jsDelivr purge failed::Two requests to $url failed. $stale"

      # Runs only after a complete publish (no `always()`: a partial train must
      # not get an archive). It refuses unless `v<version>` exists at this
      # commit and the published set is all of SHA256SUMS, and passes
      # `--verify-tag` so gh never creates the tag from the default branch. If
      # the release already exists (an earlier asset upload failed), the
      # archive is re-uploaded with --clobber.
      # If it fails, npm is live but the GitHub Release is missing: re-run this
      # job (everything is skipped on npm, the tags are verified, the full set
      # is emitted again).
      - name: Create combined GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.publishedPackages }}
          COMVI_RELEASE_TARBALLS_DIR: release-candidate
        run: node .github/scripts/create-combined-release.mjs
