name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A changeset is required only for changes that reach a published
      # artifact: a package's `files`, `src/`, entry targets, build configs and
      # the scripts its build runs, and its `package.json` unless only
      # `devDependencies` changed (a Dependabot dev bump). Tests and docs do
      # not ship. A package without `files` counts as wholly published. The
      # check is .github/scripts/published-changes.mjs (its header has the
      # exact rules); the changeset must be added or edited and parse as one.
      # It runs on the runner's own Node, before setup-node, without
      # dependencies. The base ref goes through `env`, not into the shell.
      - name: Verify changeset for published package changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/published-changes.mjs "origin/$BASE_REF"

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      # setup-node stays on v5: v6 limits automatic caching to npm,
      # and this workflow relies on `cache: pnpm`
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Security audit (published packages only — test-apps ignored)
        run: node scripts/audit-published.mjs

      # Self-tests for the scripts that version and migrate: the root
      # changelog builder, the rc version rewriter, the wrapper hooks parity
      # check, and the docs-snippet linter.
      - name: Release tooling tests
        run: pnpm test:release-tools

      # Symbol-lint over the npm documentation surface: packages/*/README.md,
      # the root README, examples/README.md and docs/design/. Catches 0.4 API
      # that 0.5.0 removed and 0.5 API a page never mentions — neither of which
      # a type-check reports, since both are about which symbols a page names
      # rather than about whether its code compiles. The type-check half is the
      # `build` job's `check:snippets:types`, which needs dist; this half needs
      # nothing and runs in seconds.
      - name: Docs snippet gate (READMEs, symbols)
        run: pnpm check:snippets

      # The instant half of the examples gate: every example's src/locales must
      # match the shared examples/locales, in both directions. StackBlitz opens
      # ONE directory out of the tree, so the catalogs have to be real copies
      # and copies drift. `pnpm examples:verify` — the build half — is a manual
      # release gate (CONTRIBUTING gate 7); it packs fourteen tarballs and runs
      # five installs, which does not belong in this job.
      - name: Examples locale sync
        run: node scripts/examples-sync-locales.mjs --check

  tests:
    name: Package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:commit

  # One build, then every check that reads dist/, in order. Splitting these
  # across jobs is what let package contracts, the size gate and the bundler
  # matrix run against a missing or stale dist.
  build:
    name: Build, package contracts, size and bundler matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # The bundler-matrix consumer fixture app installs with npm (deliberately
      # outside the pnpm workspace); cache its download work separately.
      - name: Cache npm downloads for the bundler-matrix fixture app
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: bundler-matrix-npm-${{ runner.os }}-${{ hashFiles('scripts/bundler-matrix/app/package.json') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The built dist must inline the manifest version (core's devtools
      # discovery and duplicate-copy guard key on it). Same gate the release
      # workflow runs after its build.
      - name: Inlined version gate
        run: pnpm check:inlined-version

      # The other half of the docs gate: every ts/tsx/vue/svelte fence in the
      # npm surface is compiled, under `strict`, against the packages this build
      # just produced. It lives HERE rather than in `quality` because the
      # snippets resolve `@comvi/*` through the real exports map, so it needs
      # dist — which also means a wrong `exports` condition fails the docs gate
      # too. `check=expect-error` fences are only live under this pass.
      - name: Docs snippet gate (types)
        run: pnpm check:snippets:types

      # An isolated consumer: a temp app that declares ONE Comvi package under a
      # node_modules layout that hoists nothing, generated by the real Vite
      # plugin and type-checked with `skipLibCheck: false`. It is the only gate
      # that sees what an app sees rather than what the workspace resolves, so
      # it catches a generated augmentation that reaches nothing — a failure
      # `skipLibCheck: true` otherwise hides while every unknown key compiles.
      - name: Strict consumer gate (generated types)
        run: pnpm check:strict-consumer

      # Imports the entries meant for plain Node (`@comvi/svelte/format`) from
      # packed tarballs in a fresh `node` process: the svelte root cannot load there.
      - name: Plain-Node entries gate
        run: pnpm check:node-entries

      # Verifies every publishable package's exports/main/types/bin targets are
      # present in `npm pack` output.
      - name: Package contracts
        run: pnpm audit:package-contracts

      # Lints the packed tarball of every published package for type/exports
      # correctness (false-CJS, engines/repository nits).
      - name: publint (types/exports)
        run: pnpm check:publint

      # Runs arethetypeswrong against dual ESM/CJS packages so broken declaration
      # conditions cannot ship unnoticed.
      - name: Types exports
        run: pnpm check:types-exports

      # Bundles every gated fixture in scripts/size-budgets.json through the
      # published exports map and asserts min+gz against that same file.
      - name: Size gate (min+gz budgets)
        run: pnpm size

      # pnpm-packs every workspace package the matrix needs, asserts core's
      # sideEffects array against the packed dist files, then bundles the
      # consumer fixtures with webpack AND vite under development AND
      # production conditions and runs every bundle in node.
      - name: Bundler matrix (webpack + vite, dev + prod, packed tarballs)
        run: pnpm bundler-matrix

  extension:
    name: Chrome extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds @comvi/plugin-in-context-editor first via turbo `^build` — the
      # bundle Gate E loads.
      # The production origin is scoped to THIS step: vite's loadEnv lets process.env
      # override .env.gate-e, so a job-level value would also poison the Gate E build
      # (host_permissions would name api.comvi.io and the popup could not see tab URLs).
      - name: Build editor and extension
        run: pnpm extension:build
        env:
          VITE_COMVI_API_BASE_URL: https://api.comvi.io

      - name: Verify built artifact
        run: pnpm --filter @comvi/chrome-extension exec vitest run src/__tests__/artifacts.test.ts

      - name: Install Chromium
        run: pnpm --filter @comvi/chrome-extension exec playwright install --with-deps chromium

      - name: Run Gate E
        run: pnpm --filter @comvi/chrome-extension test:e2e

      - name: Upload Gate E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-e-playwright-report
          path: |
            apps/chrome-extension/playwright-report/
            apps/chrome-extension/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Decides whether `examples-e2e` runs: only when something it exercises
  # changed. Same mechanism as the changeset gate in `quality` (a plain
  # `git diff`), rather than a third-party paths-filter action. A push whose
  # `before` is unknown (a new branch, a force-push) runs the suite.
  examples-e2e-changes:
    name: Examples e2e (change detection)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
      test_apps: ${{ steps.diff.outputs.test_apps }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}...HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..HEAD"
          else
            echo "No usable base for this ${EVENT}; running the suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "test_apps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEVANT="$(
            git diff --name-only "$RANGE" \
              | grep -E '^(packages/|examples/|scripts/examples-e2e/|scripts/docs-snippets/link-sdk|scripts/examples-verify\.mjs$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)' \
              || true
          )"

          if [ -z "$RELEVANT" ]; then
            echo "Nothing the examples e2e suite exercises changed in ${RANGE}."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes the suite exercises:"
            echo "$RELEVANT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

          # The test-apps smoke job: the packages the apps build from, the
          # apps, the script, and what decides how they resolve and build.
          TEST_APPS="$(
            git diff --name-only "$RANGE" \
              | grep -E '^(packages/|test-apps/|scripts/test-apps-smoke/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|turbo\.json$|\.npmrc$|\.github/workflows/ci\.yml$)' \
              || true
          )"
          if [ -z "$TEST_APPS" ]; then
            echo "test_apps=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes the test-apps smoke exercises:"
            echo "$TEST_APPS"
            echo "test_apps=true" >> "$GITHUB_OUTPUT"
          fi

  # `pnpm examples:e2e`, sharded: one framework and one mode per runner, so the
  # wall time is one example's build-install-serve-scenario rather than
  # fourteen of them. Each shard builds and packs the workspace itself:
  # `run.mjs` refuses stale tarballs, and rebuilding is cheaper than shipping
  # dist between jobs with mtimes it would have to trust. Production builds
  # only; dev-only warnings are covered by core's
  # `tests/dist/missing-key-warning.dist.test.ts` (see run.mjs's header).
  examples-e2e:
    name: Examples e2e (${{ matrix.framework }}, ${{ matrix.mode }})
    needs: examples-e2e-changes
    if: needs.examples-e2e-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        framework: [react, next, vue, nuxt, svelte, solid, vanilla]
        mode: [default, cdn]
        # The SSR recipe examples read bundled catalogs only; --cdn leaves them out.
        include:
          - { framework: sveltekit, mode: default }
          - { framework: solidstart, mode: default }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the scenario
        env:
          FRAMEWORK: ${{ matrix.framework }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          ARGS=(--only "$FRAMEWORK")
          if [ "$MODE" = "cdn" ]; then ARGS+=(--cdn); fi
          node scripts/examples-e2e/run.mjs "${ARGS[@]}"

      # run.mjs copies a failing example's reports, console, server and
      # Playwright logs and traces here on its own, without --keep.
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: examples-e2e-${{ matrix.framework }}-${{ matrix.mode }}
          path: test-results/examples-e2e/
          if-no-files-found: ignore
          retention-days: 14

  # `pnpm test-apps:smoke`: builds test-apps/next (Next 15), next16, nuxt
  # (Nuxt 3) and nuxt4 against the workspace packages, serves each production
  # build and checks redirects, `<html lang>`, SSR text and the Nitro route.
  # packages/next and packages/nuxt are unit-tested against the upper major of
  # their peer ranges; this job is what proves the lower one.
  test-apps-smoke:
    name: Test apps smoke (Next 15/16, Nuxt 3/4)
    needs: examples-e2e-changes
    if: needs.examples-e2e-changes.outputs.test_apps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        # No `version:` input: the action reads `packageManager` from package.json.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke-test the apps
        run: pnpm test-apps:smoke
