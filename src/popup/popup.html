<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tolkie In-Context Editor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Tolkie Editor</h1>
      <span id="version" class="version"></span>
    </header>

    <div id="status" class="status">
      <div class="status-indicator" id="status-indicator"></div>
      <span id="status-text">Checking...</span>
    </div>

    <div id="not-detected" class="message hidden">
      <p>No Tolkie SDK detected on this page.</p>
      <p class="hint">Make sure the page uses <code>@tolkie/core</code> or a framework binding.</p>
    </div>

    <div id="settings" class="settings hidden">
      <div class="field">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="Enter your Tolkie API key">
        <button id="toggle-visibility" class="toggle-btn" aria-label="Toggle visibility">
          <svg class="eye-icon" viewBox="0 0 24 24" width="16" height="16">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
      </div>

      <div class="actions">
        <button id="toggle-editor" class="btn primary" disabled>
          Enable Editor
        </button>
      </div>
    </div>

    <div id="error" class="error hidden"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
