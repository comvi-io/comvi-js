<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comvi + Vanilla TS</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcfcfb;
        --fg: #16181d;
        --muted: #5f6672;
        --line: #e6e8ec;
        --accent: #b45309;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --fg: #eceef2;
          --muted: #9aa3b2;
          --line: #262a33;
          --card: #161920;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #app {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px;
        display: grid;
        gap: 16px;
      }
      header {
        display: grid;
        gap: 12px;
        margin-block-end: 8px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
        margin: 0;
      }
      p {
        margin: 0;
      }
      .intro {
        color: var(--muted);
      }
      .switcher-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .label,
      .loading {
        color: var(--muted);
        font-size: 14px;
      }
      .switcher {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--card);
      }
      .switcher button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 8px 14px;
        cursor: pointer;
      }
      .switcher button + button {
        border-inline-start: 1px solid var(--line);
      }
      .switcher button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        display: grid;
        gap: 8px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0;
      }
      .body {
        font-size: 15px;
        color: var(--muted);
      }
      .widget {
        font-size: 17px;
        color: var(--fg);
      }
      .counter {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .square {
        inline-size: 32px;
        block-size: 32px;
        padding: 0;
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      .network {
        font:
          13px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        background: color-mix(in srgb, var(--line) 45%, transparent);
        border-radius: 8px;
        padding: 10px 12px;
        display: grid;
        gap: 2px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.88em;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .note {
        color: var(--muted);
        font-size: 14px;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        font: inherit;
        font-size: 14px;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .field-label {
        display: grid;
        gap: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .field {
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 10px;
        max-width: 320px;
      }
      .cta {
        justify-self: start;
        display: inline-block;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 8px;
      }
      .languages {
        margin: 0;
        padding-inline-start: 20px;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
        padding-block-start: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      footer span {
        margin-inline-start: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
